server:
  port: 8082

spring:
  application:
    name: xml-feed-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:aggregator_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres123}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 60000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

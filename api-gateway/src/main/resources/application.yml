server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: data-aggregator-service
          uri: ${AGGREGATOR_SERVICE_URL:http://data-aggregator-service:8081}
          predicates:
            - Path=/api/v1/aggregate/**, /aggregate/**

        - id: xml-feed-service
          uri: ${XML_FEED_SERVICE_URL:http://xml-feed-service:8082}
          predicates:
            - Path=/api/v1/posts/xml/**, /posts/xml/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

services:
  # =========================================================================
  # Database & Cache Infrastructure Services
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: aggregator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aggregator_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      # Map host 5433 to container 5432 to prevent conflict with local Windows PostgreSQL
      - "5433:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aggregator_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aggregator-net

  redis:
    image: redis:7-alpine
    container_name: aggregator-redis
    restart: unless-stopped
    command: ["redis-server", "--bind", "0.0.0.0", "--protected-mode", "no"]
    ports:
      # Map host 6380 to container 6379 to prevent conflict with local Windows Redis
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aggregator-net

  redis-seed:
    image: python:3.11-alpine
    container_name: aggregator-redis-seed
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./docker/redis:/data:ro
    command: ["python", "-u", "/data/seed.py"]
    networks:
      - aggregator-net

  # =========================================================================
  # Application Microservices (Will be enabled in subsequent commits)

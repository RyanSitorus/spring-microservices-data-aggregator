server:
  port: 8081

spring:
  application:
    name: data-aggregator-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:aggregator_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres123}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 60000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms

external:
  todos-url: ${TODOS_URL:https://jsonplaceholder.typicode.com/todos}
